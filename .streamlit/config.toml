# Keep in sync with theme.TOKENS (CSS styles the page, this styles Streamlit's widgets).
[theme]
base = "light"
primaryColor = "#1D6FE8"
backgroundColor = "#F3F5F9"
secondaryBackgroundColor = "#EDF1F7"
textColor = "#16233D"
borderColor = "#E2E7F0"
font = "Anuphan:https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap"
baseRadius = "10px"
chartCategoricalColors = ["#1D6FE8", "#F08C2E", "#8B3FD9", "#14A3B8", "#94A3B8"]

[theme.sidebar]
backgroundColor = "#0E1B33"
secondaryBackgroundColor = "#1A2B4D"
textColor = "#E3EAF6"
primaryColor = "#5B9BFF"
borderColor = "#24375C"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
